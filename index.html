<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loopwall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
<style>
  :root{ --mono: 'Space Mono', 'Courier New', Consolas, monospace; }
  *{ box-sizing: border-box; }
  html,body{ margin:0; height:100%; background:#000; color:#ffffff; font-family: var(--mono); font-size:20px; overflow:hidden; }

  /* Raw video wall, fixed 5x3, tiles flush, no chrome */
  .wall{
    position:absolute; inset:0;
    display:grid; grid-template-columns: repeat(5,1fr); grid-template-rows: repeat(3,1fr);
    gap:0;
  }
  .tile{ position:relative; background:#000; overflow:hidden; transition: opacity 0.4s ease; }
  .tile iframe{ width:100%; height:100%; border:0; display:block; pointer-events:none; }
  .tile-index{
    position:absolute; top:3px; left:5px; font-size:10px; color:#fff;
    mix-blend-mode: difference; pointer-events:none;
  }
  .wall-empty{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color: rgba(242,242,238,0.4); font-size:12px; text-align:center; padding:24px;
  }

  /* Code floats transparently over the wall — no panel, no border, no box */
  .editor-overlay{
    position:absolute; top:22px; left:22px; right:22px; bottom:160px; z-index:10;
  }
  #editorCode{ height:100%; }
  .CodeMirror{
    height:100% !important; background: rgba(0,0,0,0.4) !important; color:#ffffff !important;
    font-family: var(--mono) !important; font-size:34px; line-height:1.5; padding: 4px 6px;
  }
  .CodeMirror-gutters{ background: transparent !important; border:none !important; }
  .CodeMirror-linenumber{ color: rgba(255,255,255,0.3) !important; }
  .CodeMirror-cursor{ border-left-color:#fff !important; }
  .CodeMirror-selected{ background: rgba(255,255,255,0.2) !important; }
  .CodeMirror-activeline-background{ background: rgba(255,255,255,0.1) !important; }
  .CodeMirror pre.CodeMirror-line{ text-shadow: 0 1px 2px rgba(0,0,0,0.6); }
  .cm-comment{ color: rgba(255,255,255,0.5) !important; font-style:normal !important; }
  .cm-string{ color:#ffd60a !important; font-weight:700 !important; }
  .cm-number{ color:#ff3b3b !important; font-weight:700 !important; }
  .cm-bracket{ color:#ffd60a !important; font-weight:700 !important; }
  .cm-keyword, .cm-atom{ color:#ff3b3b !important; font-weight:700 !important; }
  .cm-variable, .cm-def{ color:#ffffff !important; }
  .line-ran{ background: rgba(255,214,10,0.28) !important; transition: background 0.4s ease; }

  /* Slim console pinned to the bottom edge */
  .console{
    position:absolute; left:0; right:0; bottom:0; height:150px; z-index:15;
    background: rgba(0,0,0,0.55); backdrop-filter: blur(5px);
    border-top:1px solid rgba(255,255,255,0.14);
    font-size:24px; color: rgba(255,255,255,0.8);
    padding:8px 14px; overflow-y:auto; white-space:pre-wrap;
  }
  .console .err{ color:#ff8a80; }
</style>
</head>
<body>

<div class="wall" id="wall">
  <div class="wall-empty" id="wallEmpty">shift+enter runs a line — set an api key, search, then play</div>
</div>

<div class="editor-overlay">
  <div id="editorCode"></div>
</div>

<div class="console" id="consoleEl">ready</div>

<script>
/* ---------------------------------------------------------------------
   STATE
--------------------------------------------------------------------- */
const COLS = 5, ROWS = 3, MAX_TILES = COLS * ROWS;
let currentApiKey = '';
const players = new Array(MAX_TILES).fill(null); // { index, videoId, ytPlayer, loopTimer, container }
let slotPointer = 0;
let ytApiReady = false;
let ytReadyQueue = [];

const wallEl = document.getElementById('wall');
const wallEmptyEl = document.getElementById('wallEmpty');
const consoleEl = document.getElementById('consoleEl');

function log(msg, isError) {
  const line = document.createElement('div');
  if (isError) line.className = 'err';
  line.textContent = msg;
  consoleEl.prepend(line);
  while (consoleEl.childNodes.length > 20) consoleEl.removeChild(consoleEl.lastChild);
}

/* ---------------------------------------------------------------------
   YOUTUBE IFRAME API BOOTSTRAP
--------------------------------------------------------------------- */
window.onYouTubeIframeAPIReady = function () {
  ytApiReady = true;
  ytReadyQueue.forEach(fn => fn());
  ytReadyQueue = [];
};
(function loadYT() {
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
})();

/* ---------------------------------------------------------------------
   API KEY — set from a line of code
--------------------------------------------------------------------- */
function apiKey(key) {
  currentApiKey = (key || '').trim();
  log(currentApiKey ? 'api key set' : 'api key cleared');
}

/* ---------------------------------------------------------------------
   WALL / PLAYER MANAGEMENT — fixed 5x3 ring buffer
--------------------------------------------------------------------- */
function resolveTargets(target) {
  const live = players.map((p, i) => p ? i : null).filter(i => i !== null);
  if (target === undefined || target === 'all') return live;
  if (Array.isArray(target)) return target;
  return [target];
}

function placeTile(videoId) {
  const index = slotPointer;
  slotPointer = (slotPointer + 1) % MAX_TILES;

  const existing = players[index];
  if (existing) {
    clearInterval(existing.loopTimer);
    existing.videoId = videoId;
    if (existing.ytPlayer && existing.ytPlayer.cueVideoById) existing.ytPlayer.cueVideoById(videoId);
    return index;
  }

  wallEmptyEl.style.display = 'none';

  const container = document.createElement('div');
  container.className = 'tile';
  container.style.order = String(index);

  const mount = document.createElement('div');
  mount.id = 'yt-mount-' + index;
  container.appendChild(mount);

  const label = document.createElement('div');
  label.className = 'tile-index';
  label.textContent = '#' + index;
  container.appendChild(label);

  wallEl.appendChild(container);

  const entry = { index, videoId, ytPlayer: null, loopTimer: null, container, mountEl: mount };
  players[index] = entry;

  function initPlayer() {
    entry.ytPlayer = new YT.Player(mount.id, {
      videoId,
      // unmuted by default — Shift+Enter is a real keypress, so play() calls
      // that follow it are treated as user-initiated and can carry sound.
      playerVars: { autoplay: 0, controls: 0, modestbranding: 1, rel: 0, playsinline: 1, mute: 0 },
      events: {
        onError: () => log('#' + index + ' failed to embed — embedding disabled by uploader', true)
      }
    });
  }
  if (ytApiReady) initPlayer(); else ytReadyQueue.push(initPlayer);

  return index;
}

function withPlayers(target, fn) {
  resolveTargets(target).forEach(i => {
    const p = players[i];
    if (p && p.ytPlayer && typeof p.ytPlayer.playVideo === 'function') fn(p);
  });
}

function play(target) { withPlayers(target, p => p.ytPlayer.playVideo()); }
function pause(target) { withPlayers(target, p => p.ytPlayer.pauseVideo()); }
function mute(target) { withPlayers(target, p => p.ytPlayer.mute()); }
function unmute(target) { withPlayers(target, p => p.ytPlayer.unMute()); }
function seek(target, seconds) { withPlayers(target, p => p.ytPlayer.seekTo(seconds, true)); }

function loopAt(target, start, duration) {
  withPlayers(target, p => {
    clearInterval(p.loopTimer);
    p.ytPlayer.seekTo(start, true);
    p.ytPlayer.playVideo();
    p.loopTimer = setInterval(() => {
      let t;
      try { t = p.ytPlayer.getCurrentTime(); } catch (e) { return; }
      if (t >= start + duration || t < start - 0.5) p.ytPlayer.seekTo(start, true);
    }, 200);
  });
}

function loop(target, secondsAgo, duration) {
  withPlayers(target, p => {
    let cur = 0;
    try { cur = p.ytPlayer.getCurrentTime(); } catch (e) {}
    loopAt(p.index, Math.max(0, cur - secondsAgo), duration);
  });
}

function cue(target, videoId) {
  withPlayers(target, p => {
    clearInterval(p.loopTimer);
    p.videoId = videoId;
    p.ytPlayer.cueVideoById(videoId);
  });
}

function phase(target, seconds) {
  withPlayers(target, p => {
    let t = 0;
    try { t = p.ytPlayer.getCurrentTime(); } catch (e) {}
    p.ytPlayer.seekTo(Math.max(0, t + seconds), true);
  });
}

function fadeOut(target) {
  resolveTargets(target).forEach(i => {
    const p = players[i];
    if (!p) return;
    p.container.style.transition = 'opacity 1s ease';
    p.container.style.opacity = '0';
    setTimeout(() => { p.ytPlayer && p.ytPlayer.pauseVideo && p.ytPlayer.pauseVideo(); }, 1000);
  });
}

/* ---------------------------------------------------------------------
   SCROLL — scroll(index, ms): tile `index` keeps its own "channel"
   (whatever query search() used to fill it). Every ms, fetch the NEXT
   fresh result for that same query and swap it into that one tile —
   only that tile changes, like scrolling a single Reels column.
--------------------------------------------------------------------- */
const channelQueries = {};    // tile index -> query string that filled it
const channelPageTokens = {}; // query -> next page token, so repeats don't happen
const scrollTimers = {};      // tile index -> interval id

async function fetchNextForChannel(query) {
  const url = 'https://www.googleapis.com/youtube/v3/search'
    + '?part=snippet&type=video&videoDuration=short&maxResults=1'
    + '&q=' + encodeURIComponent(query)
    + (channelPageTokens[query] ? '&pageToken=' + channelPageTokens[query] : '')
    + '&key=' + encodeURIComponent(currentApiKey);
  const res = await fetch(url);
  const data = await res.json();
  if (data.error) throw new Error(data.error.message || 'search failed');
  channelPageTokens[query] = data.nextPageToken || null;
  const item = (data.items || []).find(it => it.id && it.id.videoId);
  return item ? item.id.videoId : null;
}

async function advanceChannel(index) {
  const query = channelQueries[index];
  const p = players[index];
  if (!query || !p) return;
  try {
    const videoId = await fetchNextForChannel(query);
    if (!videoId) { log('#' + index + ' ran out of new results for "' + query + '"', true); return; }
    clearInterval(p.loopTimer);
    p.videoId = videoId;
    swipeFlick(p.mountEl);
    if (p.ytPlayer && p.ytPlayer.cueVideoById) {
      p.ytPlayer.cueVideoById(videoId);
      p.ytPlayer.playVideo();
    }
  } catch (err) {
    log('scroll #' + index + ' failed: ' + (err.message || err), true);
  }
}

// Thumb-flick swipe: the tile's video snaps down/faded, then eases back up
// into place, giving the swap a bit of the flung-scroll physics of a reels feed.
function swipeFlick(mountEl) {
  if (!mountEl) return;
  mountEl.style.transition = 'none';
  mountEl.style.transform = 'translateY(30px)';
  mountEl.style.opacity = '0.25';
  void mountEl.offsetHeight; // force reflow so the reset above actually applies first
  mountEl.style.transition = 'transform 0.32s cubic-bezier(0.22,1,0.36,1), opacity 0.32s ease';
  mountEl.style.transform = 'translateY(0)';
  mountEl.style.opacity = '1';
}

function scroll(index, ms) {
  if (!currentApiKey) { log('run apiKey("...") first', true); return; }
  if (!channelQueries[index]) { log('#' + index + ' has no channel yet — search() into it first', true); return; }
  clearInterval(scrollTimers[index]);
  const p = players[index];
  if (p && p.ytPlayer && p.ytPlayer.playVideo) p.ytPlayer.playVideo(); // autoplay what's already showing, right away
  scrollTimers[index] = setInterval(() => advanceChannel(index), Math.max(200, ms));
  log('scroll(' + index + ', ' + ms + 'ms) on "' + channelQueries[index] + '"');
}

function stopScroll(index) {
  if (index === undefined) {
    Object.keys(scrollTimers).forEach(i => clearInterval(scrollTimers[i]));
    for (const i in scrollTimers) delete scrollTimers[i];
    log('scroll stopped on all tiles');
    return;
  }
  clearInterval(scrollTimers[index]);
  delete scrollTimers[index];
  log('scroll stopped on #' + index);
}

/* ---------------------------------------------------------------------
   SEARCH — the only way clips get onto the wall. Count is explicit.
--------------------------------------------------------------------- */
async function search(query, count) {
  count = Math.min(count || 6, MAX_TILES);
  if (!currentApiKey) {
    log('run apiKey("...") first', true);
    return [];
  }
  log('search("' + query + '", ' + count + ') …');
  try {
    const url = 'https://www.googleapis.com/youtube/v3/search'
      + '?part=snippet&type=video&videoDuration=short&maxResults=' + count
      + '&q=' + encodeURIComponent(query) + '&key=' + encodeURIComponent(currentApiKey);
    const res = await fetch(url);
    const data = await res.json();
    if (data.error) throw new Error(data.error.message || 'search failed');
    if (data.nextPageToken) channelPageTokens[query] = data.nextPageToken;
    const items = (data.items || []).filter(it => it.id && it.id.videoId).slice(0, count);
    const indices = items.map(it => placeTile(it.id.videoId));
    if (indices.length) {
      indices.forEach(i => { channelQueries[i] = query; });
      log('search("' + query + '")  →  #' + indices.join(', #'));
    } else {
      log('search("' + query + '")  →  no results', true);
    }
    return indices;
  } catch (err) {
    log('search failed: ' + (err.message || err), true);
    return [];
  }
}

/* ---------------------------------------------------------------------
   CODE EDITOR + RUN — no chrome, no buttons
--------------------------------------------------------------------- */
const codeMirror = CodeMirror(document.getElementById('editorCode'), {
  value:
`// shift+enter runs the selection, or the current line if nothing's selected
// set your key once, then search and play — count is the number of reels
// scroll(index, ms) keeps that one tile's channel feeding in new videos

apiKey("PASTE_YOUR_YOUTUBE_API_KEY")
search("skateboard fails", 6)
play(all)
`,
  mode: 'javascript', lineNumbers: true, tabSize: 2,
  autoCloseBrackets: true, styleActiveLine: true
});

function runCode(code) {
  try {
    const fn = new Function(
      'apiKey', 'search', 'play', 'pause', 'mute', 'unmute', 'seek', 'loopAt', 'loop', 'cue', 'phase', 'fadeOut', 'scroll', 'stopScroll', 'all',
      code
    );
    fn(apiKey, search, play, pause, mute, unmute, seek, loopAt, loop, cue, phase, fadeOut, scroll, stopScroll, 'all');
  } catch (err) {
    log(String(err.message || err), true);
  }
}

codeMirror.setOption('extraKeys', {
  'Shift-Enter': function (cm) {
    const sel = cm.getSelection();
    if (sel && sel.trim()) {
      runCode(sel);
      const from = cm.getCursor('from').line, to = cm.getCursor('to').line;
      for (let l = from; l <= to; l++) flashLine(cm, l);
    } else {
      const lineNo = cm.getCursor().line;
      const line = cm.getDoc().getLine(lineNo);
      if (line.trim()) { runCode(line); flashLine(cm, lineNo); }
    }
  }
});

function flashLine(cm, lineNo) {
  cm.addLineClass(lineNo, 'background', 'line-ran');
  setTimeout(() => cm.removeLineClass(lineNo, 'background', 'line-ran'), 400);
}
</script>
</body>
</html>
